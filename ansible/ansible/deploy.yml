---
- name: Deploy BookMyShow to Amazon EKS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cluster_name: kastro-eks
    aws_region: ap-southeast-2
    target_namespace: default

  tasks:
    - name: Update EKS kubeconfig
      ansible.builtin.command:
        cmd: >
          aws eks update-kubeconfig
          --name {{ cluster_name }}
          --region {{ aws_region }}
      changed_when: false

    - name: Create target namespace
      ansible.builtin.shell:
        cmd: >
          kubectl create namespace {{ target_namespace }}
          --dry-run=client -o yaml |
          kubectl apply -f -
      changed_when: false

    - name: Deploy BookMyShow application
      ansible.builtin.command:
        cmd: kubectl apply -n {{ target_namespace }} -f deployment.yml
        chdir: "{{ playbook_dir }}/.."

    - name: Deploy BookMyShow service
      ansible.builtin.command:
        cmd: kubectl apply -n {{ target_namespace }} -f service.yml
        chdir: "{{ playbook_dir }}/.."

    - name: Wait for deployment rollout
      ansible.builtin.command:
        cmd: >
          kubectl rollout status deployment/bms-app
          -n {{ target_namespace }}
          --timeout=300s
      changed_when: false

    - name: Display deployed resources
      ansible.builtin.command:
        cmd: kubectl get pods,service -n {{ target_namespace }}
      register: deployed_resources
      changed_when: false

    - name: Show deployed resources
      ansible.builtin.debug:
        var: deployed_resources.stdout_lines
